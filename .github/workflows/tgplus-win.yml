name: TGPlus Windows installer.

# Builds a Release x64 TGPlus and packs it with Inno Setup.
# Follows win.yml, but builds Release libraries and splits the long
# dependency build into its own job. Its caches are saved even when the
# job hits the time limit, so a re-run continues where it stopped.

on:
  workflow_dispatch:
  push:
    branches:
      - tgplus/build
    paths-ignore:
      - '**.md'

concurrency:
  group: tgplus-win-${{ github.ref }}
  cancel-in-progress: false

env:
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:

  deps:
    name: Libraries (Release x64)
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install ATL for MSVC 14.44.
        shell: pwsh
        run: |
          # Breakpad's dump_syms (Release stage of prepare.py) needs ATL,
          # which the runner image doesn't ship for every toolset.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            'modify','--installPath',"`"$path`"", `
            '--add','Microsoft.VisualStudio.Component.VC.ATL', `
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', `
            '--quiet','--norestart','--nocache'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: tgplus-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-third-party-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-libs-rel-${{ env.CACHE_KEY }}-

      - name: Restore Qt cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-qt-rel-${{ env.CACHE_KEY }}-

      - name: Libraries.
        id: libs
        timeout-minutes: 320
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: tgplus-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if libraries are incomplete.
        if: steps.libs.outcome != 'success'
        run: |
          echo Libraries did not finish. Progress is cached, re-run the workflow to continue.
          exit 1

  build:
    name: TGPlus (Release x64) and installer
    needs: deps
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          VERSION="$(grep '^AppVersionStr ' $TBUILD/$REPO_NAME/Telegram/build/version | awk '{ print $2 }')"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: tgplus-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-third-party-${{ env.CACHE_KEY }}-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-libs-rel-${{ env.CACHE_KEY }}-

      - name: Restore Qt cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: tgplus-qt-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: tgplus-qt-rel-${{ env.CACHE_KEY }}-

      - name: Libraries (should be cached).
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # TDESKTOP_API_TEST uses the public test api_id from the official CI.
      # Auto-update is off so the official updater never replaces TGPlus.
      - name: TGPlus build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1

          cmake --build ..\out --config Release --parallel
          if errorlevel 1 exit /b 1

      - name: Install Inno Setup.
        run: |
          choco install innosetup -y --no-progress

      - name: Make installer.
        shell: pwsh
        run: |
          $src = "$env:TBUILD\$env:REPO_NAME"
          $rel = "$src\out\Release"
          Get-ChildItem $rel | Select-Object Name, Length | Format-Table
          if (!(Test-Path "$rel\Telegram.exe")) { throw "Telegram.exe was not built" }
          $iss = Get-Content "$src\Telegram\build\setup.iss" -Raw
          # Own name, id and folder, so it never touches an official install.
          $iss = $iss -replace '#define MyAppShortName "Telegram"', '#define MyAppShortName "TGPlus"'
          $iss = $iss -replace '#define MyAppName "Telegram Desktop"', '#define MyAppName "TGPlus"'
          $iss = $iss -replace '#define MyAppPublisher "Telegram FZ-LLC"', '#define MyAppPublisher "TGPlus (unofficial build)"'
          $iss = $iss -replace '#define MyAppURL "https://desktop.telegram.org"', '#define MyAppURL "https://github.com/voidzxcdev/tgplus"'
          $iss = $iss -replace '#define MyAppId "53F49750-6209-4FBF-9CA8-7A333C87D1ED"', '#define MyAppId "B7E2C1A4-5D3F-4E8A-9C61-2F7A9D0E4B13"'
          $iss = $iss -replace '(?m)^SignTool=.*\r?\n', ''
          $iss = $iss -replace '(?m)^Source: "\{#ReleasePath\}\\Updater\.exe".*\r?\n', ''
          if (!(Test-Path "$rel\modules\x64\d3d\d3dcompiler_47.dll")) {
            $iss = $iss -replace '(?m)^Source: "\{#ReleasePath\}\\\{#ModulesFolder\}\\d3d.*\r?\n', ''
          }
          $out = "$src\Telegram\build\tgplus.iss"
          Set-Content -Path $out -Value $iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/dMyAppVersion=$env:APP_VERSION" "/dMyAppVersionZero=$env:APP_VERSION" "/dMyAppVersionFull=$env:APP_VERSION" "/dReleasePath=$rel" "/dMyBuildTarget=win64" "/dMyOutputBaseFilename=tgplus-setup-x64-$env:APP_VERSION" $out
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force installer, portable | Out-Null
          Move-Item "$rel\tgplus-setup-x64-*.exe" installer\
          Copy-Item "$rel\Telegram.exe" portable\
          if (Test-Path "$rel\modules") { Copy-Item "$rel\modules" portable\ -Recurse }

      - uses: actions/upload-artifact@v4
        name: Upload installer.
        with:
          name: TGPlus installer x64
          path: installer\
          retention-days: 14

      - uses: actions/upload-artifact@v4
        name: Upload portable build.
        with:
          name: TGPlus portable x64
          path: portable\
          retention-days: 14
