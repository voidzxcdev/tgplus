services:
  - type: web
    name: tgplus-recorder
    runtime: python
    plan: free
    region: frankfurt
    branch: tgplus/build
    rootDir: recorder
    buildCommand: pip install -r requirements.txt
    startCommand: python recorder.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - recorder/**
      ignoredPaths: []
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION
        sync: false
      - key: MEDIA_SCOPE
        value: private
      - key: MEDIA_MAX_MB
        value: "20"
      - key: RECORD_CHANNELS
        value: "0"
      - key: RECORD_OUTGOING
        value: "0"
